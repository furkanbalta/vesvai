name: Vesvabot Release Notes

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Run vesvabot
        uses: vesvai/vesvabot@v0.1
        with:
          mode: release-notes
          token: ${{ secrets.GITHUB_TOKEN }}
          llm-provider: ${{ secrets.VESVABOT_PROVIDER }}
          llm-model: ${{ secrets.VESVABOT_MODEL }}
          llm-api-key: ${{ secrets.VESVABOT_API_KEY }}
          prompt-file: .github/prompts/release-notes.md
          release-id: ${{ github.event.release.id }}
          max-iterations: '40'
          timeout-minutes: '15'
name: Vesvabot Respond

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  respond:
    if: contains(github.event.comment.body, '@vesvabot')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run vesvabot
        uses: vesvabot/vesvabot@v0.1
        with:
          mode: respond
          token: ${{ secrets.GITHUB_TOKEN }}
          llm-provider: ${{ secrets.VESVABOT_PROVIDER }}
          llm-model: ${{ secrets.VESVABOT_MODEL }}
          llm-api-key: ${{ secrets.VESVABOT_API_KEY }}
          prompt-file: .github/prompts/respond.md
          issue-number: ${{ github.event.issue.number }}
          required-permission: admin
          unauthorized-action: skip
          bot-login: vesvabot
          max-iterations: '40'
          timeout-minutes: '15'